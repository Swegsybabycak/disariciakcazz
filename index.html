<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dışarı Çıkacaz Hadila 🌸</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
  min-height: 100vh;
  background: linear-gradient(135deg, #ffe0f0 0%, #fff0f7 40%, #fce4f5 70%, #ffe8f8 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  position: relative;
}
.bubble {
  position: fixed;
  border-radius: 50%;
  opacity: 0.18;
  animation: floatUp linear infinite;
  pointer-events: none;
}
@keyframes floatUp {
  0%   { transform: translateY(110vh) scale(0.8); opacity: 0; }
  10%  { opacity: 0.18; }
  90%  { opacity: 0.18; }
  100% { transform: translateY(-20vh) scale(1.1); opacity: 0; }
}
.heart {
  position: fixed;
  font-size: 22px;
  animation: floatHeart linear infinite;
  pointer-events: none;
  opacity: 0;
}
@keyframes floatHeart {
  0%   { transform: translateY(110vh) rotate(-10deg); opacity: 0; }
  10%  { opacity: 0.5; }
  90%  { opacity: 0.4; }
  100% { transform: translateY(-10vh) rotate(10deg); opacity: 0; }
}
#app {
  position: relative;
  z-index: 10;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 2rem 1rem;
  text-align: center;
  width: 100%;
}
.card {
  background: rgba(255,255,255,0.78);
  border-radius: 32px;
  padding: 3rem 2.5rem;
  border: 1.5px solid rgba(255,182,213,0.5);
  box-shadow: 0 8px 40px rgba(255,100,180,0.12), 0 2px 12px rgba(255,150,200,0.1);
  max-width: 420px;
  width: 100%;
  animation: cardIn 0.7s cubic-bezier(.34,1.56,.64,1) both;
}
@keyframes cardIn {
  from { transform: scale(0.85) translateY(30px); opacity: 0; }
  to   { transform: scale(1) translateY(0); opacity: 1; }
}
.emoji-top {
  font-size: 52px;
  display: block;
  margin-bottom: 1rem;
  animation: bounce 2s ease-in-out infinite;
}
@keyframes bounce {
  0%,100% { transform: translateY(0); }
  50%     { transform: translateY(-8px); }
}
h1 {
  font-size: 22px;
  font-weight: 800;
  color: #d63a8e;
  margin-bottom: 0.5rem;
  line-height: 1.4;
}
.sub {
  font-size: 14px;
  color: #e87ab8;
  margin-bottom: 2rem;
  font-weight: 600;
}
#btn-container {
  display: flex;
  gap: 16px;
  align-items: center;
  justify-content: center;
  flex-wrap: nowrap;
}
#btn-yes {
  background: linear-gradient(135deg, #f472b6, #ec4899);
  color: white;
  border: none;
  border-radius: 50px;
  font-size: 18px;
  font-weight: 800;
  font-family: inherit;
  cursor: pointer;
  padding: 14px 36px;
  width: 140px;
  height: 54px;
  transition: all 0.35s cubic-bezier(.34,1.56,.64,1);
  box-shadow: 0 4px 20px rgba(236,72,153,0.35);
  letter-spacing: 0.5px;
}
#btn-yes:hover {
  transform: scale(1.07) translateY(-2px);
  box-shadow: 0 8px 28px rgba(236,72,153,0.45);
}
#btn-no {
  background: white;
  color: #d63a8e;
  border: 2px solid #f9a8d4;
  border-radius: 50px;
  font-size: 18px;
  font-weight: 700;
  font-family: inherit;
  cursor: pointer;
  padding: 14px 36px;
  transition: all 0.35s ease;
  white-space: nowrap;
  box-shadow: 0 2px 10px rgba(249,168,212,0.2);
}
#btn-no:hover { background: #fff0f7; }
#msg {
  margin-top: 1.2rem;
  font-size: 14px;
  font-weight: 700;
  color: #e87ab8;
  min-height: 20px;
}
#success {
  display: none;
  flex-direction: column;
  align-items: center;
  gap: 0.8rem;
  animation: cardIn 0.6s cubic-bezier(.34,1.56,.64,1) both;
}
#success .big {
  font-size: 64px;
  animation: spinIn 0.6s cubic-bezier(.34,1.56,.64,1);
}
@keyframes spinIn {
  from { transform: rotate(-30deg) scale(0.5); }
  to   { transform: rotate(0deg) scale(1); }
}
#success p { font-size: 24px; font-weight: 800; color: #d63a8e; }
#success small { font-size: 14px; color: #e87ab8; font-weight: 600; }
.confetti-piece {
  position: fixed;
  pointer-events: none;
  animation: confettiFall linear forwards;
  border-radius: 2px;
}
@keyframes confettiFall {
  0%   { transform: translateY(-20px) rotate(0deg); opacity: 1; }
  100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
}
</style>
</head>
<body>

<div id="app">
  <div class="card">
    <div id="question-view">
      <span class="emoji-top">🌸</span>
      <h1>Bizimle dışarı çıkmak ister misin?</h1>
      <p class="sub">Hadi gel, seni bekliyoruz! 💕</p>
      <div id="btn-container">
        <button id="btn-yes" onclick="handleYes()">✨ Evet!</button>
        <button id="btn-no" onclick="handleNo()">Hayır</button>
      </div>
      <p id="msg"></p>
    </div>
    <div id="success">
      <div class="big">🎉</div>
      <p>Yaaay! Harika! 🥳</p>
      <small>Geldiğin çok mutlu olacağız 💕</small>
    </div>
  </div>
</div>

<script>
const colors = ['#f9a8d4','#fbcfe8','#fda4af','#f472b6','#ec4899','#ff8fab','#ffb3c6'];

for (let i = 0; i < 10; i++) {
  const b = document.createElement('div');
  b.className = 'bubble';
  const size = 40 + Math.random() * 80;
  b.style.cssText = `width:${size}px;height:${size}px;background:${colors[Math.floor(Math.random()*colors.length)]};left:${Math.random()*100}%;animation-duration:${6+Math.random()*8}s;animation-delay:${Math.random()*6}s;`;
  document.body.appendChild(b);
}

const emojis = ['🌸','💕','🌷','💖','✨','🎀'];
for (let i = 0; i < 8; i++) {
  const h = document.createElement('div');
  h.className = 'heart';
  h.textContent = emojis[Math.floor(Math.random()*emojis.length)];
  h.style.cssText = `left:${Math.random()*100}%;animation-duration:${7+Math.random()*6}s;animation-delay:${Math.random()*7}s;`;
  document.body.appendChild(h);
}

let noCount = 0;
const messages = [
  "Emin misin? 🥺",
  "Gerçekten mi? 😢",
  "Bir daha düşün... 🌸",
  "Yanlış tuşa bastın herhalde 😅",
  "Bak üzülüyor! 💔",
  "Neden kaçıyorsun? 👀",
  "Son şans... 😬",
  "Zaten evet diyeceksin 😄",
  "Tamam inat etme artık! 🎀",
];

function handleNo() {
  noCount++;
  const btnNo = document.getElementById('btn-no');
  const btnYes = document.getElementById('btn-yes');
  const msg = document.getElementById('msg');

  const shrink = Math.max(0.45, 1 - noCount * 0.09);
  const grow = 1 + noCount * 0.13;

  btnNo.style.fontSize = Math.max(9, 18 * shrink) + 'px';
  btnNo.style.padding = Math.max(4, 14*shrink)+'px '+Math.max(8, 36*shrink)+'px';
  btnNo.style.opacity = Math.max(0.25, 1 - noCount * 0.08);

  btnYes.style.width = (140 * grow) + 'px';
  btnYes.style.height = (54 * grow) + 'px';
  btnYes.style.fontSize = (18 * grow) + 'px';

  msg.textContent = noCount <= messages.length ? messages[noCount-1] : '😂 Artık gelmek zorundasın!';

  if (noCount >= 9) btnNo.style.display = 'none';
}

function handleYes() {
  document.getElementById('question-view').style.display = 'none';
  const s = document.getElementById('success');
  s.style.display = 'flex';
  spawnConfetti();
}

function spawnConfetti() {
  const c = ['#f472b6','#ec4899','#fda4af','#fbcfe8','#fff','#f9a8d4','#ff8fab'];
  for (let i = 0; i < 60; i++) {
    const p = document.createElement('div');
    p.className = 'confetti-piece';
    p.style.cssText = `left:${Math.random()*100}%;top:0;background:${c[Math.floor(Math.random()*c.length)]};animation-duration:${1.5+Math.random()*2}s;animation-delay:${Math.random()*0.8}s;border-radius:${Math.random()>0.5?'50%':'2px'};width:${6+Math.random()*8}px;height:${6+Math.random()*8}px;`;
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 4000);
  }
}
</script>
</body>
</html>
